# frozen_string_literal: true

plugins:
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - 'bin/**/*'
    - 'vendor/**/*'
    - 'coverage/**/*'
    - 'tmp/**/*'
    - 'Gemfile.lock'

Metrics/MethodLength:
  Max: 30

Metrics/AbcSize:
  Max: 35

# Keyword options are how signatures grow without breaking positional callers
Metrics/ParameterLists:
  CountKeywordArgs: false

Metrics/ClassLength:
  Max: 200

# Router's ClassMethods holds the whole route DSL and code generator (candidate for splitting out)
Metrics/ModuleLength:
  Max: 360

Metrics/CyclomaticComplexity:
  Max: 12

Metrics/PerceivedComplexity:
  Max: 12

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'
    - '*.gemspec'

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  EnforcedStyle: always

Layout/LineLength:
  Max: 120
  Exclude:
    - 'spec/**/*'

Naming/FileName:
  Exclude:
    - 'lib/client-api-builder.rb'


# RSpec configuration
RSpec/ExampleLength:
  Max: 20

RSpec/MultipleExpectations:
  Max: 8

RSpec/NestedGroups:
  Max: 4

RSpec/MultipleMemoizedHelpers:
  Max: 20

# Allow unnamed subject references
RSpec/NamedSubject:
  Enabled: false

# Spec directory uses hyphens to match gem name
RSpec/SpecFilePathFormat:
  Enabled: false

# Allow descriptive context names
RSpec/ContextWording:
  Enabled: false

# Allow repeated describe blocks for different scenarios
RSpec/RepeatedExampleGroupDescription:
  Enabled: false
